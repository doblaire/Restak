[package]
name = "restak"
version = "0.1.0"
description = "Restak – A lightweight front-end game launcher"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "Restak"
path = "src/main.rs"

[lib]
name = "restak_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["devtools"] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
walkdir = "2.5"
futures = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

